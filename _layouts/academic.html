<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic-v4.css' | relative_url }}">
</head>
<body>
<div class="site-wrap">
<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}">CHAOLIN TIAN</a>
  <nav class="site-nav" aria-label="Main navigation">
    {% for link in site.data.navigation.main %}
    <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
</header>
<main class="page-main" id="main-content">{{ content }}</main>
<footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} CHAOLIN TIAN</span><span>chaolin.tian@kellogg.northwestern.edu</span></footer>
</div>
</body>
</html>
